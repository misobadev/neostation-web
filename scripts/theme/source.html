<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeoStation Theme Designer</title>
<style>
  /* ---- Designer chrome: the site's own tokens (see DESIGN.md) ---- */
  :root{
    --bench-bg:var(--color-ink); --plate:var(--color-ink-2); --plate-2:var(--color-ink-3);
    --hair:var(--color-line); --bone:var(--color-bone); --bone-2:var(--color-bone-2); --bone-3:var(--color-bone-3);
    --start:var(--color-start); --start-hi:var(--color-start-hover);
    --mono:var(--font-mono); --sans:var(--font-sans);
    --app-font:'Anta', var(--font-sans);
  }
  *{box-sizing:border-box}

  /* The site's content column (as PageHero): 76rem, 1.25rem gutters, 2rem from md. */
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:2rem;align-items:start;
    max-width:76rem;margin:0 auto;padding:0 1.25rem 4rem}
  @media (min-width:768px){ .workspace{padding-left:2rem;padding-right:2rem} }
  @media (max-width:1024px){ .workspace{grid-template-columns:minmax(0,1fr)} }

  /* ---- Stage: tabs, corners, screen ---- */
  .stage{min-width:0}
  .stage-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:.2rem;background:var(--plate);gap:.15rem;margin:0}
  .seg button{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-2);
    background:transparent;border:0;border-radius:999px;padding:.45rem .9rem;cursor:pointer;transition:background-color .15s,color .15s}
  .seg button:hover{color:var(--bone)}
  .seg button.on{background:var(--bone);color:var(--bench-bg)}
  .seg.small button{padding:.35rem .6rem}
  .corners{display:inline-flex;align-items:center;gap:.6rem}
  .corners .lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-3)}

  .bezel{border:1px solid var(--hair);border-radius:1rem;background:var(--plate);padding:.75rem}
  .screen{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:.6rem;container-type:inline-size}
  .hint{font-size:.85rem;line-height:1.5;color:var(--bone-3);margin:.75rem .25rem 0}
  .hint b{color:var(--bone-2);font-weight:600}

  /* ---- The app mock. Everything is laid out in the app's own units: the
     app is designed at 640×480 and scales to the screen, so 1u = 1/640 of
     the screen's width. ---- */
  .app{--u:calc(100cqw / 640);position:absolute;inset:0;background:var(--bg);color:var(--text);
    font-family:var(--app-font);overflow:hidden;
    --glass:color-mix(in srgb,var(--bg) 83%, transparent);
    --r:calc(var(--u) * var(--rx, 14)); --ri:calc(var(--u) * var(--rxi, 10))}
  .app .view{position:absolute;inset:0;display:none}
  .app .view.on{display:block}
  .abs{position:absolute}
  /* The NeoGlass rim, as the app paints it: a stroke outside the element's
     edge (the rect grown by half the width, the radius too), shaded along the
     top-left to bottom-right diagonal. 2 logical px, the app's default. */
  .rim{--w:calc(var(--u)*2);--rr:999px}
  .rim::before{content:"";position:absolute;inset:calc(var(--w) * -1);border-radius:calc(var(--rr) + var(--w));padding:var(--w);
    background:var(--rimg);mix-blend-mode:var(--rimblend,normal);pointer-events:none;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  .card.rim,.side-panel.rim{--rr:var(--r)}
  /* The site styles .card and .pill (a 1px ink line); the mock draws only
     the app's rim, so drop that border here. */
  .app .card,.app .pill{border:0}

  .ico{width:calc(var(--u)*14);height:calc(var(--u)*14);flex:none;display:block;fill:currentColor}
  .mask{flex:none;display:block;background:currentColor;
    -webkit-mask-position:center;-webkit-mask-repeat:no-repeat;-webkit-mask-size:contain;
    mask-position:center;mask-repeat:no-repeat;mask-size:contain}
  .ni-grids{-webkit-mask-image:url(/theme-designer/nav/grids.webp);mask-image:url(/theme-designer/nav/grids.webp)}
  .ni-cloud{-webkit-mask-image:url(/theme-designer/nav/cloud-add.webp);mask-image:url(/theme-designer/nav/cloud-add.webp)}
  .ni-trophy{-webkit-mask-image:url(/theme-designer/nav/enhance-prize.webp);mask-image:url(/theme-designer/nav/enhance-prize.webp)}
  .ni-gear{-webkit-mask-image:url(/theme-designer/nav/setting.webp);mask-image:url(/theme-designer/nav/setting.webp)}
  .ni-lb{-webkit-mask-image:url(/theme-designer/pad/lb.png);mask-image:url(/theme-designer/pad/lb.png)}
  .ni-rb{-webkit-mask-image:url(/theme-designer/pad/rb.png);mask-image:url(/theme-designer/pad/rb.png)}
  .pad-a{-webkit-mask-image:url(/theme-designer/pad/a.png);mask-image:url(/theme-designer/pad/a.png)}
  .pad-x{-webkit-mask-image:url(/theme-designer/pad/x.png);mask-image:url(/theme-designer/pad/x.png)}
  .pad-menu{-webkit-mask-image:url(/theme-designer/pad/menu.png);mask-image:url(/theme-designer/pad/menu.png)}

  /* Header: Search, the tab cluster with its bumpers, the status pill. */
  .hdr{position:absolute;left:0;right:0;top:calc(var(--u)*9);height:calc(var(--u)*28)}
  .pill{position:absolute;display:flex;align-items:center;border-radius:999px;white-space:nowrap}
  .search{left:calc(var(--u)*8);top:0;height:100%;padding:0 calc(var(--u)*12) 0 calc(var(--u)*7);gap:calc(var(--u)*6);
    background:var(--btn);color:var(--onBtn);font-size:calc(var(--u)*11)}
  .search .mask{width:calc(var(--u)*13);height:calc(var(--u)*13)}
  .bump{position:absolute;top:calc(var(--u)*8);width:calc(var(--u)*20);height:calc(var(--u)*12);color:var(--text)}
  .tabs{position:absolute;top:calc(var(--u)*-2);height:calc(var(--u)*33);padding:calc(var(--u)*3);gap:calc(var(--u)*2);
    display:flex;align-items:center;border-radius:999px;background:var(--surface)}
  .tab{width:calc(var(--u)*30);height:calc(var(--u)*27);border-radius:calc(var(--u)*11);display:grid;place-items:center;color:var(--text)}
  .tab .mask,.tab .ico{width:calc(var(--u)*14);height:calc(var(--u)*14)}
  .tab.sel{background:var(--sel);color:var(--onSel)}
  .status{right:calc(var(--u)*8);top:0;height:100%;padding:0 calc(var(--u)*11);gap:calc(var(--u)*9);
    background:var(--surface);color:var(--text);font-size:calc(var(--u)*10.5)}
  .status .ico{width:calc(var(--u)*12);height:calc(var(--u)*12)}
  .status .bat{display:flex;align-items:center;gap:calc(var(--u)*4);color:var(--ok)}
  .bat .ico{width:calc(var(--u)*13)}

  /* System cards: artwork over a logo strip, in the card colour. */
  .card{position:absolute;background:var(--surface);border-radius:var(--r);color:var(--text)}
  .card .art{position:absolute;border-radius:var(--ri);background:var(--surface) center/cover no-repeat;overflow:hidden}
  .card .logo{position:absolute;left:8%;right:8%;-webkit-mask-size:contain;mask-size:contain}
  .card.selcard{background:var(--scard);color:var(--onScard)}
  .card .art.logo-all{background:#111216 url(https://cdn.neoassets.dev/packs/neostation/backgrounds/all.gif) center/cover no-repeat}

  /* Footer: name pill with the game count, Options, Enter. */
  .ftr{position:absolute;left:0;right:0;top:calc(var(--u)*445);height:calc(var(--u)*28)}
  .name{left:calc(var(--u)*12);height:100%;padding:0 calc(var(--u)*5) 0 calc(var(--u)*12);gap:calc(var(--u)*9);
    background:var(--surface);color:var(--text);font-size:calc(var(--u)*12)}
  .name:not(:has(.count)){padding-right:calc(var(--u)*12)}
  .count{height:calc(var(--u)*18);padding:0 calc(var(--u)*8);border-radius:999px;display:flex;align-items:center;
    background:var(--scard);color:var(--onScard);font-size:calc(var(--u)*8.5)}
  .fbtn{height:100%;padding:0 calc(var(--u)*10) 0 calc(var(--u)*6);gap:calc(var(--u)*4);font-size:calc(var(--u)*12);font-weight:600}
  .fbtn .mask,.fbtn .ico{width:calc(var(--u)*18);height:calc(var(--u)*18)}
  .opts{background:var(--btn);color:var(--onBtn)}
  .enter{background:var(--act);color:var(--onAct)}

  /* Carousel chip track. */
  .chips{position:absolute;left:0;right:0;top:calc(var(--u)*405);height:calc(var(--u)*26);
    display:grid;grid-template-columns:1fr auto 1fr;gap:calc(var(--u)*4)}
  .chips .side{display:flex;gap:calc(var(--u)*4);overflow:hidden;padding:calc(var(--u)*3);margin:calc(var(--u)*-3)}
  .chips .side.l{justify-content:flex-end}
  .chip{position:relative;flex:none;height:calc(var(--u)*26);padding:0 calc(var(--u)*12);border-radius:999px;display:flex;align-items:center;
    background:var(--surface);color:var(--text);font-size:calc(var(--u)*8.5)}
  .chip.sel{background:var(--sel);color:var(--onSel);font-weight:700}

  /* Grid. */
  .rec .foot{position:absolute;left:0;right:0;display:grid;place-items:center;font-size:calc(var(--u)*10);font-weight:800;letter-spacing:.1em}

  /* Game list. */
  .fan{position:absolute;inset:0;background:center/cover no-repeat}
  .fan::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
  .glass{background:var(--glass)}
  .side-panel{left:calc(var(--u)*12);top:calc(var(--u)*12);width:calc(var(--u)*200);height:calc(var(--u)*455);border-radius:var(--r);
    color:var(--text)}
  .side-panel .syslogo{position:absolute;left:calc(var(--u)*55);right:calc(var(--u)*55);top:calc(var(--u)*14);height:calc(var(--u)*30)}
  .rows{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);top:calc(var(--u)*56);bottom:calc(var(--u)*6);overflow:hidden}
  .row{height:calc(var(--u)*25);margin-bottom:calc(var(--u)*1);border-radius:var(--ri);display:flex;align-items:center;gap:calc(var(--u)*6);
    padding:0 calc(var(--u)*8);font-size:calc(var(--u)*9.3);white-space:nowrap;overflow:hidden}
  .row.sel{background:var(--sel);color:var(--onSel)}
  .row .ico{width:calc(var(--u)*10);height:calc(var(--u)*10)}
  .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row .heart{color:var(--err)}
  .row.sel .heart{color:var(--onSel)}
  .row .chk{color:var(--ok)}
  .dtabs{right:calc(var(--u)*40);top:calc(var(--u)*12);height:calc(var(--u)*33)}
  .dtabs .tab{width:calc(var(--u)*37)}
  .dpad{position:absolute;top:calc(var(--u)*21);width:calc(var(--u)*16);height:calc(var(--u)*16);color:var(--text)}
  .wheel{position:absolute;left:calc(var(--u)*294);top:calc(var(--u)*103);width:calc(var(--u)*265);height:auto;
    filter:drop-shadow(0 calc(var(--u)*3) 0 rgba(0,0,0,.5))}
  .romline{position:absolute;left:calc(var(--u)*228);right:calc(var(--u)*12);top:calc(var(--u)*398);height:calc(var(--u)*18);
    display:flex;align-items:center;gap:calc(var(--u)*10);color:#fff;font-size:calc(var(--u)*12.5);font-weight:700;
    text-shadow:0 calc(var(--u)*1) calc(var(--u)*2) #000;white-space:nowrap}
  .romname{min-width:0;overflow:hidden}
  .clock{display:flex;align-items:center;gap:calc(var(--u)*5)}
  .clock .ico{width:calc(var(--u)*13);height:calc(var(--u)*13)}
  .gfoot{position:absolute;top:calc(var(--u)*425);height:calc(var(--u)*40);display:flex;align-items:center;border-radius:999px;color:var(--text)}
  .rating{left:calc(var(--u)*228);width:calc(var(--u)*64);justify-content:center;gap:calc(var(--u)*7);font-size:calc(var(--u)*16)}
  .rating .ico{width:calc(var(--u)*16);height:calc(var(--u)*16);color:color-mix(in srgb,var(--err),var(--ok) 80%)}
  .ra{left:calc(var(--u)*296);width:calc(var(--u)*100);padding:0 calc(var(--u)*6);gap:calc(var(--u)*6)}
  .ra .icon{width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;background:var(--surface) center/cover no-repeat;flex:none}
  .ra .txt{flex:1;font-size:calc(var(--u)*11);display:flex;flex-direction:column;gap:calc(var(--u)*4)}
  .ra .bar{height:calc(var(--u)*6);border-radius:calc(var(--u)*4);background:color-mix(in srgb,var(--text) 10%, transparent);margin-right:calc(var(--u)*6);overflow:hidden}
  .ra .bar i{display:block;height:100%;width:3%;background:var(--warn)}
  .round{width:calc(var(--u)*40);justify-content:center}
  .round .ico{width:calc(var(--u)*21);height:calc(var(--u)*21)}
  .round.fav{color:var(--err)}
  .play{left:calc(var(--u)*537);width:calc(var(--u)*87);justify-content:center;border-radius:var(--ri);
    background:var(--act);color:var(--onAct);font-size:calc(var(--u)*13);letter-spacing:.04em;
    box-shadow:calc(var(--u)*2) calc(var(--u)*2) calc(var(--u)*4) rgba(0,0,0,.1)}

  /* ---- Palette strip above the stage ---- */
  .strip{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;border:1px solid var(--hair);border-radius:999px;
    background:var(--plate);padding:.5rem .9rem;margin-bottom:.75rem}
  .strip .lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-3);margin-right:.35rem}
  .dot{width:1.05rem;height:1.05rem;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

  /* ---- Editor panel ---- */
  .panel{border:1px solid var(--hair);border-radius:1rem;background:var(--plate);padding:1.1rem;position:sticky;top:5.5rem;
    max-height:calc(100vh - 7rem);overflow:auto;color:var(--bone)}
  @media (max-width:1024px){ .panel{position:static;max-height:none} }
  .fld{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-3);margin:0 0 .4rem}
  .panel input[type=text],.panel select{width:100%;font:inherit;font-size:.9rem;color:var(--bone);background:var(--bench-bg);
    border:1px solid var(--hair);border-radius:.6rem;padding:.55rem .7rem;outline:none;transition:border-color .15s}
  .panel input[type=text]:focus,.panel select:focus{border-color:var(--bone-3)}
  .panel select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--bone-2) 50%),linear-gradient(135deg,var(--bone-2) 50%,transparent 50%);
    background-position:calc(100% - 1rem) 55%,calc(100% - .7rem) 55%;background-size:.3rem .3rem;background-repeat:no-repeat}
  .stack{display:grid;gap:.85rem}
  .two{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:end}
  .btnx{display:inline-flex;align-items:center;justify-content:center;min-height:2.4rem;border-radius:999px;padding:.45rem 1.1rem;
    font:inherit;font-size:.9rem;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s;
    border:1px solid var(--bone-3);background:transparent;color:var(--bone)}
  .btnx:hover{border-color:var(--bone);background:var(--plate-2)}
  .btnx.primary{background:var(--start);border-color:transparent;color:var(--bench-bg)}
  .btnx.primary:hover{background:var(--start-hi)}
  .file-hide{display:none}
  .seg.full{display:flex}
  .seg.full button{flex:1}

  .group{border-top:1px solid var(--hair);margin-top:1.1rem;padding-top:1rem}
  .group h3{display:flex;align-items:baseline;gap:.55rem;font-size:1rem;font-weight:700;margin:0}
  .group h3 .n{font-family:var(--mono);font-size:.72rem;color:var(--start);font-weight:500}
  .group p{font-size:.82rem;color:var(--bone-3);margin:.2rem 0 .6rem}
  .sw{display:grid;grid-template-columns:2.1rem 1fr auto 5.6rem;align-items:center;gap:.6rem;padding:.4rem 0}
  .sw .pick{position:relative;width:2.1rem;height:2.1rem;border-radius:.55rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);overflow:hidden}
  .sw .pick input{position:absolute;inset:-.5rem;width:3rem;height:3rem;opacity:0;cursor:pointer}
  .sw .nm{display:block;font-size:.9rem;font-weight:600;line-height:1.2}
  .sw .ds{display:block;font-size:.75rem;color:var(--bone-3);line-height:1.3}
  .sw .on-row .nm{font-weight:500;color:var(--bone-2)}
  .sw .hex{width:100%;font-family:var(--mono);font-size:.78rem;text-transform:uppercase;text-align:center;color:var(--bone);
    background:var(--bench-bg);border:1px solid var(--hair);border-radius:999px;padding:.4rem .3rem;outline:none}
  .sw .hex:focus{border-color:var(--bone-3)}
  .cr:empty{visibility:hidden}
  .cr{font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;border-radius:999px;padding:.2rem .45rem;white-space:nowrap;
    border:1px solid var(--hair);color:var(--bone-2)}
  .cr.ok{border-color:color-mix(in srgb,var(--color-green) 55%, transparent);color:var(--color-green)}
  .cr.bad{border-color:color-mix(in srgb,var(--start) 60%, transparent);color:var(--start)}
  .export{display:flex;gap:.5rem;justify-content:flex-end;border-top:1px solid var(--hair);margin-top:1.1rem;padding-top:1rem}
  .note{font-size:.78rem;color:var(--bone-3);line-height:1.45;margin:.8rem 0 0}

  .toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,1rem);opacity:0;pointer-events:none;z-index:60;
    background:var(--bone);color:var(--bench-bg);font-weight:600;font-size:.9rem;border-radius:999px;padding:.55rem 1.1rem;
    transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

function parseOklch(str){
  const m=String(str).match(/oklch\(\s*([\d.]+)%?\s+([\d.]+)\s+([\d.-]+)/i);
  if(!m) return {L:0,C:0,H:0};
  let L=Number.parseFloat(m[1]); if(str.includes('%')) L/=100;
  return {L, C:Number.parseFloat(m[2]), H:Number.parseFloat(m[3])};
}
function oklchToHex(str){
  const {L,C,H}=parseOklch(str);
  const hr=H*Math.PI/180;
  const a=C*Math.cos(hr);
  const b=C*Math.sin(hr);
  const l_=L+0.3963377774*a+0.2158037573*b;
  const m_=L-0.1055613458*a-0.0638541728*b;
  const s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3;
  const m=m_**3;
  const s=s_**3;
  const r= 4.0767416621*l-3.3077115913*m+0.2309699292*s;
  const g=-1.2684380046*l+2.6097574011*m-0.3413193965*s;
  const bl=-0.0041960863*l-0.7034186147*m+1.7076147010*s;
  const gam=c=>{const v=c<=0.0031308?12.92*c:1.055*c ** (1/2.4)-0.055; return Math.max(0,Math.min(1,v));};
  const h2=x=>Math.round(gam(x)*255).toString(16).padStart(2,'0');
  return `#${h2(r)}${h2(g)}${h2(bl)}`;
}
function toHex(v){
  const s=String(v||'').trim();
  if(/oklch/i.test(s)) return oklchToHex(s).toUpperCase();
  let h=s.replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(h.length===8) h=h.slice(2);
  return /^[0-9a-fA-F]{6}$/.test(h)?`#${h.toUpperCase()}`:null;
}
function lum(hex){
  const h=hex.replace('#','');
  const c=[0,2,4].map(i=>{const v=Number.parseInt(h.slice(i,i+2),16)/255; return v<=0.03928?v/12.92:((v+0.055)/1.055)**2.4;});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function ratio(a,b){ const x=lum(a); const y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }

/* ---- model ---- */
function newModel(){ return { name:'My Custom Theme', id:'my_custom_theme', author:'', brightness:'dark', colors:{} }; }
let model=newModel();
let corner=3;
const $=s=>document.querySelector(s);
const rows={};

function buildGroups(){
  const root=$('#groups'); root.innerHTML='';
  for(const g of GROUPS){
    const el=document.createElement('div'); el.className='group';
    el.innerHTML=`<h3><span class="n">${g.n}</span>${g.title}</h3><p>${g.desc}</p>`;
    for(const [field,label,desc,isOn] of g.fields){
      const row=document.createElement('div'); row.className='sw';
      row.innerHTML=`
        <span class="pick"><input type="color" aria-label="${label} colour" /></span>
        <span class="${isOn?'on-row':''}"><span class="nm">${label}</span><span class="ds">${desc}</span></span>
        <span class="cr"></span>
        <input class="hex" type="text" spellcheck="false" maxlength="7" aria-label="${label} hex" />`;
      const color=row.querySelector('input[type=color]');
      const hex=row.querySelector('.hex');
      rows[field]={color,hex,pick:row.querySelector('.pick'),cr:row.querySelector('.cr')};
      color.addEventListener('input',()=>setField(field,color.value));
      hex.addEventListener('input',()=>{ const h=toHex(hex.value); if(h&&hex.value.replace('#','').length===6) setField(field,h,true); });
      hex.addEventListener('blur',()=>syncOne(field));
      el.appendChild(row);
    }
    root.appendChild(el);
  }
}

function setField(field,hex,fromHex){ model.colors[field]=hex.toUpperCase(); if(!fromHex) syncOne(field); else syncSwatch(field); refresh(); }
function syncSwatch(field){ const r=rows[field]; const v=model.colors[field]; if(!r||!v) return; r.color.value=v.toLowerCase(); r.pick.style.background=v; }
function syncOne(field){ syncSwatch(field); const r=rows[field]; if(r) r.hex.value=model.colors[field]; }
function syncAll(){ for(const f of FIELDS) syncOne(f); }

function syncContrast(){
  for(const [field,[against,min]] of Object.entries(CONTRAST)){
    const r=rows[field]; if(!r) continue;
    const v=Math.min(...against.map(a=>ratio(model.colors[field],model.colors[a])));
    r.cr.textContent=`${v.toFixed(1)}:1`;
    r.cr.className=`cr ${v>=min?'ok':'bad'}`;
    r.cr.title=v>=min?`Readable (needs ${min}:1)`:`Hard to read: needs at least ${min}:1`;
  }
}

/* Paints the mock with the model. */
function applyPreview(){
  const app=$('#app'); const c=model.colors;
  const vars={'--bg':c.background,'--surface':c.surface,'--text':c.text,'--border':c.border,
    '--sel':c.selection,'--onSel':c.onSelection,'--scard':c.selectedCard,'--onScard':c.onSelectedCard,
    '--act':c.action,'--onAct':c.onAction,'--btn':c.button,'--onBtn':c.onButton,
    '--ok':c.success,'--warn':c.warning,'--err':c.error,'--info':c.info};
  for(const [k,v] of Object.entries(vars)) app.style.setProperty(k,v);
  // The app's glass rim: a faint white highlight on dark grounds, the text
  // colour on light ones, where a highlight would vanish.
  const light=lum(c.background)>0.4;
  const ink=a=>`color-mix(in srgb, ${c.text} ${a}%, transparent)`;
  app.style.setProperty('--rimg', light
    ? `linear-gradient(to bottom right, ${ink(22)} 0%, ${ink(16)} 60%, ${ink(12)} 100%)`
    : 'linear-gradient(to bottom right, rgba(255,255,255,.08) 0%, rgba(255,255,255,.05) 60%, rgba(255,255,255,.012) 100%)');
  app.style.setProperty('--rimblend', light?'normal':'plus-lighter');
  const [rx,rxi]=CORNERS[corner];
  app.style.setProperty('--rx',rx); app.style.setProperty('--rxi',rxi);
  const strip=$('#strip');
  for(const d of strip.querySelectorAll('.dot')) d.remove();
  for(const f of FIELDS){ const d=document.createElement('span'); d.className='dot'; d.style.background=c[f]; d.title=`${f} ${c[f]}`; strip.appendChild(d); }
}
function refresh(){ applyPreview(); syncContrast(); }

/* ---- shared mock pieces ---- */
function buildHeaders(){
  for(const h of document.querySelectorAll('[data-hdr]')){
    h.innerHTML=`
      <span class="pill search rim"><span class="mask pad-x"></span>Search</span>
      <span class="bump mask ni-lb" style="left:calc(var(--u)*209)"></span>
      <span class="tabs rim" style="left:calc(var(--u)*235)">
        <span class="tab sel"><span class="mask ni-grids"></span></span>
        <span class="tab"><svg class="ico"><use href="#i-store"/></svg></span>
        <span class="tab"><span class="mask ni-cloud"></span></span>
        <span class="tab"><span class="mask ni-trophy"></span></span>
        <span class="tab"><span class="mask ni-gear"></span></span>
      </span>
      <span class="bump mask ni-rb" style="left:calc(var(--u)*411)"></span>
      <span class="pill status rim"><svg class="ico"><use href="#i-bell"/></svg>15:07<span class="bat"><svg class="ico" viewBox="0 0 26 24"><use href="#i-bat"/></svg>100%</span></span>`;
  }
  for(const f of document.querySelectorAll('[data-ftr]')){
    const [id,count,enter]=f.dataset.ftr.split('|');
    const name=SYSTEMS[id]?.short||id;
    const countChip=count?`<span class="count">${count}</span>`:'';
    f.innerHTML=`
      <span class="pill name rim">${name}${countChip}</span>
      <span class="pill fbtn opts rim" style="left:calc(var(--u)*463)"><span class="mask pad-menu"></span>Options</span>
      <span class="pill fbtn enter rim" style="left:calc(var(--u)*557)"><span class="mask pad-a"></span>${enter}</span>`;
  }
}

/* The systems grid: six columns, the recent game spanning two. */
function buildGrid(){
  // Measured on the device: 92-wide cards, 10 between columns, 7.5 between rows.
  const cols=6; const x0=18; const w=92; const gap=10; const y0=55; const h=117; const vgap=7.5;
  const cards=[
    ['recent',1],['all'],['favorites'],['collections'],['android'],
    ['arc'],['a2'],['2600'],['cv'],['vect'],['msx'],
    ['nes'],['sg1k'],['fc'],['cpc'],['sms'],['mark3'],
    ['lynx'],['neogeo'],['gg'],['snes'],['favorites'],['arc'],
  ];
  let col=0; let row=0; let html='';
  for(const [id,sel] of cards){
    const span=id==='recent'?2:1;
    if(col+span>cols){ col=0; row++; }
    const left=x0+col*(w+gap); const top=y0+row*(h+vgap); const width=w*span+gap*(span-1);
    const inner=id==='recent'
      // The last game played: its logo over its own art.
      ? `<span class="art" style="left:calc(var(--u)*4);top:calc(var(--u)*4);right:calc(var(--u)*4);height:calc(var(--u)*81);background-image:url(/theme-designer/game/bubblebobble-wheel.webp),url(/theme-designer/game/bubblebobble-fanart.webp);background-size:auto 80%,cover"></span>`
      : id==='all'
      ? '<span class="art logo-all" style="left:calc(var(--u)*4);top:calc(var(--u)*4);right:calc(var(--u)*4);height:calc(var(--u)*85)"></span>'
      : `<span class="art" style="left:calc(var(--u)*4);top:calc(var(--u)*4);right:calc(var(--u)*4);height:calc(var(--u)*85);background-image:url(${CDN}${id}.webp)"></span>`;
    const foot=id==='recent'
      ? '<span class="foot" style="top:calc(var(--u)*85);height:calc(var(--u)*32)">TIME PLAYED: 4 SECONDS</span>'
      : `<span class="logo mask" style="top:calc(var(--u)*89);height:calc(var(--u)*26);left:calc(var(--u)*8);right:calc(var(--u)*8);-webkit-mask-image:url(/theme-designer/logos/${id}.webp);mask-image:url(/theme-designer/logos/${id}.webp)"></span>`;
    html+=`<div class="card rim${sel?' selcard':''}${id==='recent'?' rec':''}" style="left:calc(var(--u)*${left});top:calc(var(--u)*${top});width:calc(var(--u)*${width});height:calc(var(--u)*${h})">${inner}${foot}</div>`;
    col+=span;
  }
  $('#grid').innerHTML=html;
}

/* The carousel's chip track, centred on the selected system as in the app. */
function buildChips(){
  const chip=(id,sel)=>`<span class="chip rim${sel?' sel':''}">${(SYSTEMS[id]?.short||id).toUpperCase()}</span>`;
  $('#chips').innerHTML=
    `<div class="side l">${['sms','pccd','tgcd','gb','tg16','lynx'].map(id=>chip(id)).join('')}</div>`+
    chip('neogeo',true)+
    `<div class="side">${['gg','snes','sfc','scd','cps2','jag'].map(id=>chip(id)).join('')}</div>`;
}

function buildRows(){
  const games=['007 : Nightfire','Ace Combat Advance','Action Man : Robot Atak','Activision Anthology','Advance Guardian Heroes','Advance Wars','Advance Wars 2 : Black Hole Rising','Aladdin','Alien Hominid','Alienators : Evolution Continues','An American Tail: Fievel’s Gold Rush','Animal Snap : Rescue Them 2 by 2','Army Men : Operation Green'];
  const heart='<svg class="ico heart"><use href="#i-heart"/></svg>';
  $('#rows').innerHTML=
    `<div class="row sel">${heart}<span class="t">Bubble Bobble : Old &amp; New</span><svg class="ico"><use href="#i-download"/></svg></div>`+
    `<div class="row">${heart}<span class="t">Goodboy Galaxy</span></div>`+
    games.map(g=>`<div class="row"><span class="t">${g}</span></div>`).join('');
}

const LEGEND={
  carousel:'Screen <b>Background</b> · cards, chips and pills <b>Cards</b> with <b>Text</b> · selected tab and chip <b>Selection</b> · game count <b>Selected card</b> · Options and Search <b>Button</b> · Enter <b>Main button</b> · battery <b>Success</b>. The centred card keeps the card colour.',
  grid:'Selected card (here the last game played) <b>Selected card</b> with its text in <b>Text on selected card</b> · other cards <b>Cards</b> · selected tab <b>Selection</b> · Options <b>Button</b> · Play <b>Main button</b>.',
  list:'Sidebar, rating, achievements and round buttons are glass: <b>Background</b> let through over the game art · selected game <b>Selection</b> · PLAY <b>Main button</b> · achievement progress <b>Warning</b> · favourite hearts <b>Error</b> · rating star mixes <b>Error</b> and <b>Success</b>. The file name is always white, as in the app.',
};
function setView(v){
  for(const el of document.querySelectorAll('.view')) el.classList.toggle('on',el.dataset.view===v);
  for(const b of document.querySelectorAll('#viewSeg button')) b.classList.toggle('on',b.dataset.v===v);
  $('#legend').innerHTML=LEGEND[v];
}
function setCorner(i){
  corner=i;
  for(const b of document.querySelectorAll('#cornerSeg button')) b.classList.toggle('on',Number(b.dataset.c)===i);
  applyPreview();
}
function setBright(b){ model.brightness=b==='light'?'light':'dark'; for(const x of document.querySelectorAll('#brightSeg button')) x.classList.toggle('on',x.dataset.b===model.brightness); }

/* ---- import / export ---- */
function snake(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'my_theme'; }

/* Accepts the v2 format and the older daisyUI-style JSON. */
function fromJson(m){
  const src=m.colors||m;
  const pick=(k,fb)=>toHex(src[k])||fb;
  const base=PRESETS.dark.colors;
  const colors={};
  if(m.format==='neostation-theme'||src.background!=null){
    for(const f of FIELDS) colors[f]=pick(f,base[f]);
  }else{
    const map={background:'base-100',surface:'base-200',text:'base-content',border:'base-300',
      selection:'primary',onSelection:'primary-content',selectedCard:'secondary',onSelectedCard:'secondary-content',
      action:'primary',onAction:'primary-content',button:'base-200',onButton:'base-content',
      success:'success',warning:'warning',error:'error',info:'info'};
    for(const f of FIELDS) colors[f]=pick(map[f],base[f]);
  }
  const b=String(m.brightness||m.colorScheme||m.scheme||'dark').toLowerCase();
  return { name:m.name||'Imported Theme', id:snake(m.id||m.name), author:m.author||'', brightness:b==='light'?'light':'dark', colors };
}
function loadModel(m){
  model=fromJson(m);
  $('#tName').value=model.name; $('#tId').value=model.id; $('#tAuthor').value=model.author;
  setBright(model.brightness); syncAll(); refresh();
}
function exportJson(){
  const colors={}; for(const f of FIELDS) colors[f]=model.colors[f];
  return JSON.stringify({ format:'neostation-theme', version:2, name:model.name, id:snake(model.id||model.name),
    author:model.author, brightness:model.brightness, colors }, null, 2);
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

function init(){
  buildGroups(); buildHeaders(); buildGrid(); buildChips(); buildRows();
  const sel=$('#preset');
  for(const [k,p] of Object.entries(PRESETS)){ const o=document.createElement('option'); o.value=k; o.textContent=p.name; sel.appendChild(o); }
  sel.value='dark';
  sel.addEventListener('change',()=>{ const p=PRESETS[sel.value];
    loadModel({name:$('#tName').value,id:$('#tId').value,author:$('#tAuthor').value,brightness:p.brightness,colors:p.colors});
    toast(`${p.name} loaded`); });
  $('#tName').addEventListener('input',e=>{ model.name=e.target.value; });
  $('#tId').addEventListener('input',e=>{ model.id=e.target.value.trim(); });
  $('#tId').addEventListener('blur',e=>{ model.id=snake(e.target.value); e.target.value=model.id; });
  $('#tAuthor').addEventListener('input',e=>{ model.author=e.target.value; });
  $('#brightSeg').addEventListener('click',e=>{ const b=e.target.dataset.b; if(b) setBright(b); });
  $('#viewSeg').addEventListener('click',e=>{ const v=e.target.dataset.v; if(v) setView(v); });
  $('#cornerSeg').addEventListener('click',e=>{ const c=e.target.dataset.c; if(c!=null) setCorner(Number(c)); });
  $('#copyBtn').addEventListener('click',()=>navigator.clipboard.writeText(exportJson()).then(()=>toast('JSON copied')));
  $('#dlBtn').addEventListener('click',()=>{
    const blob=new Blob([exportJson()],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${snake(model.id)}.json`;
    a.click(); URL.revokeObjectURL(a.href); toast('Downloaded'); });
  $('#importBtn').addEventListener('click',()=>$('#fileInput').click());
  $('#fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ try{ loadModel(JSON.parse(r.result)); sel.value=''; toast('Imported'); }catch(_err){ toast('Not a theme file'); } };
    r.readAsText(f); e.target.value=''; });

  loadModel({...PRESETS.dark, name:'My Custom Theme', id:'my_custom_theme'});
  setView('carousel');
}
init();
</script>
