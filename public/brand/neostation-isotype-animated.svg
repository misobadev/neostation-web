  100% { transform: translate(0px, 0px) rotate(-45deg) scale(1, 1) rotate(45deg); animation-timing-function: linear; }
}
@keyframes ns-look-ring {
  0% { transform: rotate(0deg) rotate(-45deg) scale(1, 1) rotate(45deg); animation-timing-function: linear; }
